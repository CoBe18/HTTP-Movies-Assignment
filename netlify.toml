[build]
base = "client"
command = "npm run build"
publish = "dist"
functions = "../netlify/functions"
[build.environment]
NODE_VERSION = "22"
[[redirects]]
from = "/api/movies"
to = "/.netlify/functions/movies"
status = 200
[[redirects]]
from = "/api/movies/*"
to = "/.netlify/functions/movies/:splat"
status = 200
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
